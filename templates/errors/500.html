{% extends "base.html" %}

{% block title %}Something went wrong | Civic Desk{% endblock %}

{% block content %}
<div class="container py-5 mt-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="cyber-card p-5 border-danger">
                <i class="bi bi-bug-fill text-danger display-1 mb-4"></i>
                <h2 class="text-danger">Something went wrong</h2>
                <p class="text-secondary my-4">

                </p>
                <a href="/" class="btn btn-outline-info"><i class="bi bi-house me-1" aria-hidden="true"></i> Return home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
